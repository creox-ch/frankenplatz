<!-- ============================================================
     Frankenplatz — CANONICAL header + footer (source of truth).
     Copy these two blocks inline into every Market / Trips page and
     keep them in sync. Styles: site/chrome.css. Behaviour: site/chrome.js.
     Root-level pages use the paths below; pages inside a subfolder
     (e.g. trips/) prefix internal links with ../ and drop the trips/ segment.
     Per page: set the correct nav links (texts unchanged) and add
     class "fp-top__link--active" (+ aria-current="page") to the current item.
     ============================================================ -->

<!-- HEADER -->
<header class="fp-top">
  <a class="fp-top__logo" href="/">Frankenplatz.ch</a>
  <nav class="fp-top__nav">
    <!-- per-page links here -->
  </nav>
  <button class="fp-top__burger" aria-label="Открыть меню" aria-expanded="false"></button>
  <div class="fp-top__menu">
    <!-- same per-page links here -->
  </div>
</header>

<!-- FOOTER -->
<footer class="fp-foot">
  <div class="fp-foot__grid">
    <div><p class="fp-foot__name"><a href="/">Frankenplatz.ch</a></p></div>
    <nav>
      <p class="fp-foot__h">Страницы</p>
      <div class="fp-foot__nav"><!-- per-branch page links --></div>
    </nav>
    <div>
      <p class="fp-foot__h">Соцсети</p>
      <div class="fp-foot__soc">
        <a href="https://www.instagram.com/frankenplatz.ch/" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
    <div>
      <p class="fp-foot__h">Новости форума</p>
      <form class="fp-foot__form">
        <input class="fp-foot__input" type="email" required placeholder="Твой e-mail" aria-label="E-mail">
        <button class="fp-foot__send" type="submit">Подписаться</button>
      </form>
      <p class="fp-foot__note">Никакого спама — только программа и спикеры.</p>
    </div>
  </div>
  <div class="fp-foot__bottom">
    <span>© 2026 Frankenplatz.ch · Форум о деньгах в Швейцарии · 24–25.10.2026 · Baden <svg class="fp-flag" viewBox="0 0 32 32" role="img" aria-label="Швейцария"><rect width="32" height="32" fill="#FF0000"></rect><rect x="13" y="6" width="6" height="20" fill="#FFFFFF"></rect><rect x="6" y="13" width="20" height="6" fill="#FFFFFF"></rect></svg> · 15 мин от Zürich HB</span>
    <span class="fp-foot__legal"><a href="/legal#impressum">Impressum</a> · <a href="/legal#agb">AGB</a> · <a href="/legal#datenschutz">Datenschutz</a></span>
    <span><a href="https://www.instagram.com/frankenplatz.ch/" target="_blank" rel="noopener">@frankenplatz.ch</a></span>
  </div>
</footer>
