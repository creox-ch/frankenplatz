<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frankenplatz · Свой счёт — карусель</title>
<link rel="stylesheet" href="carousel.css">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="post.css">
<style>
  .cover-tags .ct{ display:inline-flex; align-items:center; gap:12px; }
  .cover-tags .ct .ci{ font-size:1.05em; line-height:1; }
</style>
</head>
<body>
<div id="app" data-theme="theme-violet"></div>
<script src="https://cdn.jsdelivr.net/npm/@zumer/snapdom/dist/snapdom.min.js"></script>
<script>
/* ============================================================
   Frankenplatz — карусель «Свой счёт».
   4 слайда: обложка · миф · как открыть · вывод.
   Стиль/темы/шрифты/экспорт — из общей системы (carousel.css).
   ============================================================ */
const FP_FOOTER = `<div class="footer"><span class="site"><svg class="fl" viewBox="0 0 24 24"><rect class="sq" width="24" height="24" rx="5"/><rect class="cx" x="10" y="5" width="4" height="14"/><rect class="cx" x="5" y="10" width="14" height="4"/></svg><span class="ftxt"><span class="fname">frankenplatz.ch</span><span class="reg">форум о деньгах в Швейцарии</span></span></span></div>`;

const SLIDES = [
  /* 1 — ОБЛОЖКА */
  `<div class="bg"></div>
    <div class="stack cover">
      <div class="datacap">Деньги · Швейцария</div>
      <div class="title-cover"><span class="line">Свой счёт — это</span><span class="line">не&nbsp;про недоверие,</span><span class="line">а&nbsp;про то, что</span><span class="line">ты — <span class="grad">взрослая</span></span></div>
      <div class="lead">Общий бюджет — удобно. Но&nbsp;когда своих денег нет вообще, любой развод, переезд или ссора становятся <b>ловушкой</b>. Разбираемся спокойно, без&nbsp;драмы.</div>
    </div>
    <div class="cta corner">Листай дальше <span class="arrow">→</span></div>`,

  /* 2 — МИФ */
  `<div class="bg"></div><div class="pager">Разбор · миф</div>
    <div class="stack">
      <div class="title"><span class="t-line">«У нас всё общее»</span><span class="t-line">— красивый <span class="hi-red">миф</span></span></div>
      <div class="duo">
        <div class="block myth"><div class="lbl">Звучит так</div><div class="txt">«У&nbsp;нас всё общее» — по-семейному и&nbsp;тепло.</div></div>
        <div class="block real"><div class="lbl">На самом деле</div><div class="txt">Слишком часто это значит <b>«всё записано на&nbsp;кого-то одного»</b>. В&nbsp;Швейцарии счёт открыт на&nbsp;конкретное имя — и&nbsp;доступ к&nbsp;деньгам тоже.</div></div>
      </div>
      <div class="prose">Свой <b>Privatkonto</b> не&nbsp;отменяет общий бюджет — он&nbsp;просто значит, что у&nbsp;тебя есть деньги, к&nbsp;которым никто, кроме тебя, не&nbsp;дотянется.</div>
    </div>`,

  /* 3 — КАК ОТКРЫТЬ */
  `<div class="bg"></div><div class="pager">Как открыть · 15 минут</div>
    <div class="stack">
      <div class="title"><span class="t-line">Как открыть —</span><span class="t-line">это <span class="hi">15 минут</span></span></div>
      <div class="items">
        <div class="item"><div class="num">01</div><div class="h">Выбери банк</div><div class="t">Neon, Yuh или&nbsp;кантональный — что удобнее.</div></div>
        <div class="item"><div class="num">02</div><div class="h">Заведи Privatkonto онлайн</div><div class="t">Нужен паспорт и&nbsp;<span class="de">Ausweis</span>.</div></div>
        <div class="item"><div class="num">03</div><div class="h">Настрой Dauerauftrag</div><div class="t">Часть денег капает сюда <b>сама</b>.</div></div>
        <div class="item"><div class="num">04</div><div class="h">Рядом открой Sparkonto</div><div class="t">Под подушку — на&nbsp;чёрный день.</div></div>
      </div>
    </div>`,

  /* 4 — ВЫВОД */
  `<div class="bg"></div><div class="pager">Вывод</div>
    <div class="stack">
      <div class="concl"><span class="c-line">15 минут сегодня —</span><span class="c-line"><span class="grad">спокойствие</span></span><span class="c-line">на&nbsp;годы</span></div>
      <div class="concl-desc">Своя финансовая история, подушка, до&nbsp;которой дотягиваешься только&nbsp;ты, и&nbsp;право уйти, если станет плохо. Не&nbsp;потому что что-то случится — а&nbsp;потому что ты хочешь встречать что угодно <b>на&nbsp;своих ногах</b>.</div>
      <div class="cta" style="background:transparent;border:2px solid var(--accent2);color:var(--accent2)">🐮 Какой банк для экспатов — на форуме <span class="arrow">→</span></div>
    </div>`,
];

const FP_COVER = `<div class="bg"></div>
  <div class="stack" style="justify-content:center;">
    <div class="datacap">Деньги · Швейцария</div>
    <div class="title-cover"><span class="line">Свой счёт —</span><span class="line">это про то, что</span><span class="line">ты — <span class="grad">взрослая</span></span></div>
    <div class="lead">В&nbsp;Швейцарии счёт открыт на&nbsp;конкретное имя — и&nbsp;доступ к&nbsp;деньгам тоже. Разбираем, как за&nbsp;15&nbsp;минут завести <b>свой Privatkonto</b>, к&nbsp;которому дотягиваешься только&nbsp;ты.</div>
    <div class="cover-tags"><span class="ct"><span class="ci">📄</span>Privatkonto — для твоих денег</span><span class="ct"><span class="ci">🏦</span>Neon · Yuh</span><span class="ct"><span class="ci">🔁</span>Dauerauftrag — для накоплений</span></div>
  </div>` + FP_FOOTER;

(function () {
  const app = document.getElementById('app');
  let curTheme = app.dataset.theme || 'theme-violet';
  document.body.classList.add(curTheme, 'font-a');
  let cur = 0;

  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="dot"></span> Frankenplatz <span style="color:#9A8BB3;font-weight:600">· свой счёт</span></div>
      <div class="tools">
        <div class="seg" id="themeSeg">
          <button data-theme="theme-white">Светлый</button>
          <button data-theme="theme-violet" class="on">Фиолетовый</button>
          <button data-theme="theme-brown">Коричневый</button>
        </div>
        <div class="seg" id="fontSeg">
          <button data-font="font-a" class="on">A · Unbounded</button>
          <button data-font="font-b">B · Montserrat</button>
          <button data-font="font-c">C · Manrope</button>
        </div>
        <button class="btn ghost on" id="gridBtn" aria-pressed="true">Клетка</button>
        <button class="btn" id="pngOne">PNG слайда</button>
        <button class="btn gold" id="pngAll">Скачать карусель</button>
      </div>
    </div>
    <div class="shell">
      <div class="main">
        <div class="viewport"><div class="frame" id="frame"></div></div>
        <div class="nav">
          <button class="arrow" id="prev" aria-label="Назад">‹</button>
          <div class="dots" id="dots"></div>
          <div class="count"><b id="cIdx">1</b> / <span id="cTot">1</span></div>
          <button class="arrow" id="next" aria-label="Вперёд">›</button>
        </div>
      </div>
      <aside class="coverpane">
        <div class="cp-h"><div class="t">Обложка для Telegram<small>единая картинка · 1080×1350</small></div>
          <button class="btn gold" id="pngCover">PNG</button></div>
        <div class="cp-stage"><div class="cover-frame" id="coverFrame"></div></div>
      </aside>
    </div>`;

  const frame = document.getElementById('frame');
  const coverFrame = document.getElementById('coverFrame');
  const dots = document.getElementById('dots');
  const cIdx = document.getElementById('cIdx');
  const cTot = document.getElementById('cTot');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  let slides = [];

  frame.innerHTML = SLIDES
    .map((html, k) => `<div class="slide${k === 0 ? ' active' : ''}" data-i="${k}">${html}${FP_FOOTER}${k > 0 ? `<div class="pageno">${k + 1}<span class="tot">/ ${SLIDES.length}</span></div>` : ''}</div>`)
    .join('');
  dots.innerHTML = SLIDES.map((_, k) => `<i data-i="${k}" class="${k === 0 ? 'on' : ''}"></i>`).join('');
  slides = [...frame.querySelectorAll('.slide')];
  dots.querySelectorAll('i').forEach(d => d.onclick = () => show(+d.dataset.i));
  cTot.textContent = SLIDES.length;
  coverFrame.innerHTML = `<div class="slide active">${FP_COVER}</div>`;

  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle('active', k === cur));
    dots.querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === cur));
    cIdx.textContent = cur + 1;
    prev.disabled = cur === 0;
    next.disabled = cur === slides.length - 1;
  }
  prev.onclick = () => show(cur - 1);
  next.onclick = () => show(cur + 1);
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });

  const vp = app.querySelector('.viewport');
  const cpStage = app.querySelector('.cp-stage');
  function fitEl(stage, el) {
    if (!stage) return;
    const cs = getComputedStyle(stage);
    const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (w > 0 && h > 0) el.style.transform = `scale(${Math.min(w / 1000, h / 1250, 1) || 1})`;
  }
  function fit() { fitEl(vp, frame); fitEl(cpStage, coverFrame); }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(vp); new ResizeObserver(fit).observe(cpStage); }

  document.querySelectorAll('#themeSeg button').forEach(b => b.onclick = () => {
    document.body.classList.remove('theme-white', 'theme-violet', 'theme-brown');
    curTheme = b.dataset.theme; document.body.classList.add(curTheme);
    document.querySelectorAll('#themeSeg button').forEach(x => x.classList.toggle('on', x === b));
  });
  document.querySelectorAll('#fontSeg button').forEach(b => b.onclick = () => {
    document.body.classList.remove('font-a', 'font-b', 'font-c');
    document.body.classList.add(b.dataset.font);
    document.querySelectorAll('#fontSeg button').forEach(x => x.classList.toggle('on', x === b));
  });
  const gridBtn = document.getElementById('gridBtn');
  gridBtn.onclick = () => {
    const off = document.body.classList.toggle('no-grid');
    gridBtn.classList.toggle('on', !off);
    gridBtn.setAttribute('aria-pressed', String(!off));
  };

  // ---- экспорт PNG (1080×1350) ----
  const OUT_W = 1080;
  async function render(el) {
    await document.fonts.ready;
    const wasActive = el.classList.contains('active');
    el.classList.add('active');
    const scaled = el.closest('.frame, .cover-frame');
    const prevT = scaled ? scaled.style.transform : null;
    if (scaled) scaled.style.transform = 'none';
    const bg = getComputedStyle(el).backgroundColor;
    let out;
    try {
      const srcW = el.offsetWidth || 1000;
      const scale = (OUT_W * 2) / srcW;
      const shot = await snapdom(el, { scale, backgroundColor: bg, embedFonts: true });
      const src = await shot.toCanvas();
      out = document.createElement('canvas');
      out.width = OUT_W * 2; out.height = Math.round(OUT_W * 2 * 1.25);
      const ctx = out.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(src, 0, 0, out.width, out.height);
    } finally {
      if (scaled) scaled.style.transform = prevT;
      if (!wasActive) el.classList.remove('active');
    }
    return out;
  }
  function dl(canvas, name) { const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = name; a.click(); }
  const slug = () => curTheme.replace('theme-', '');

  document.getElementById('pngOne').onclick = async function () {
    this.textContent = '…'; this.disabled = true;
    try { dl(await render(slides[cur]), `frankenplatz-schet-${slug()}-${String(cur + 1).padStart(2, '0')}.png`); }
    finally { this.textContent = 'PNG слайда'; this.disabled = false; }
  };
  document.getElementById('pngAll').onclick = async function () {
    this.disabled = true;
    for (let k = 0; k < slides.length; k++) {
      this.textContent = `Рендер ${k + 1}/${slides.length}…`;
      dl(await render(slides[k]), `frankenplatz-schet-${slug()}-${String(k + 1).padStart(2, '0')}.png`);
      await new Promise(r => setTimeout(r, 350));
    }
    this.textContent = 'Скачать карусель'; this.disabled = false;
  };
  document.getElementById('pngCover').onclick = async function () {
    this.textContent = '…'; this.disabled = true;
    try { dl(await render(coverFrame.querySelector('.slide')), `frankenplatz-schet-cover-${slug()}.png`); }
    finally { this.textContent = 'PNG'; this.disabled = false; }
  };

  show(0);
  requestAnimationFrame(fit);
})();
</script>
</body>
</html>
